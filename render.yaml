services:
  - type: web
    name: pocket-gamebox-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://pocket-gamebox-multiplayer.onrender.com
