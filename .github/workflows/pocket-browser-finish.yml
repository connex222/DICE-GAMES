name: Pocket Gamebox complete browser sessions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/browser-finish.mjs'
      - '.github/workflows/pocket-browser-finish.yml'
jobs:
  complete-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium driver
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Run isolated local-only server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pocket-http.log 2>&1 &
          sleep 2
      - name: Complete seven genuine browser games to final results and replay
        run: node tests/browser-finish.mjs
      - name: Preserve complete-game reports and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-completed-ui-games
          path: qa-evidence/finished/
          if-no-files-found: warn
          retention-days: 7
