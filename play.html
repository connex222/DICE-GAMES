<div class="overlay" id="guide-panel" role="dialog" aria-modal="true" aria-labelledby="guide-title"><div class="dialog"><h2 id="guide-title">Quick guide</h2><p id="guide-body"></p><div class="actions"><button type="button" id="guide-close">Back to game</button></div></div></div><span id="audio-status" role="status" aria-live="polite"></span>
<script>
'use strict';
const GAMES={
'gilded-five':['Gilded Five','games/gilded-five.html'],
'shut-the-box':['Shut the Box','games/shut-the-box.html'],
'liars-dice':["Liar’s Dice",'games/liars-dice.html'],
'bust-or-bank':['Bust or Bank','games/bust-or-bank.html'],
'generala':['Generala','games/generala.html'],
 'ten-of-a-kind':['Ten of a Kind','games/ten-of-a-kind.html'],
'brain-raid':['Brain Raid','games/brain-raid.html']
};
const slug=new URLSearchParams(location.search).get('game');const item=Object.hasOwn(GAMES,slug)?GAMES[slug]:null;
const frame=document.getElementById('game'),title=document.getElementById('title'),modal=document.getElementById('confirm');
if(item){title.textContent=item[0];document.title=item[0]+' · Pocket Gamebox';frame.title=item[0];frame.src=item[1];}else{frame.style.display='none';document.getElementById('error').style.display='block';title.textContent='Choose a game';}
// Recorded asset mixer and audio preferences are in assets/pocket-quality.js.
const ask=()=>{modal.classList.add('open');document.getElementById('stay').focus();};
document.getElementById('home').addEventListener('click',ask);
document.getElementById('stay').addEventListener('click',()=>{modal.classList.remove('open');document.getElementById('home').focus();});
document.getElementById('quit').addEventListener('click',()=>{location.assign('index.html');});
modal.addEventListener('click',e=>{if(e.target===modal)document.getElementById('stay').click();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))document.getElementById('stay').click();});
document.getElementById('expand').addEventListener('click',()=>document.body.classList.add('immersive'));
document.getElementById('float').addEventListener('click',()=>document.body.classList.remove('immersive'));
// No old offline audio caches; disable previously installed service workers.
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
</script><script src="assets/pocket-quality.js"></script><script src="assets/collection-fullscreen.js?v=20261114" defer></script></body></html>
