background:#081a20}.tile img{display:block;width:100%;aspect-ratio:1.25;object-fit:cover}.tile span{display:flex;justify-content:space-between;align-items:center;padding:10px;font-weight:bold;font-size:13px;gap:8px}.tile b{font-size:11px;color:#ffce6c}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.controls button{background:#1f3934;border:1px solid #e4b96a;border-radius:10px;color:#ffe1a1;padding:12px;min-height:44px}}@media(max-width:360px){.tiles{grid-template-columns:1fr}.tile img{aspect-ratio:2}}
</style></head><body>

<dialog id="dlg"><h2 id="dlgTitle">Settings</h2><div id="dlgBody"></div><button id="close">Close</button></dialog><p class="status" id="status"></p>
<script>
const $=s=>document.getElementById(s);
const get=k=>localStorage.getItem(k);
const on=(k,def=false)=>get(k)===null?def:get(k)==='on';
function set(k,v){localStorage.setItem(k,v?'on':'off');render()}
function render(){$('status').textContent=`Voice: ${on('pg-quiet-voice')?'ON':'OFF'} · Sound FX: ${get('pg-effects-off')==='yes'?'OFF':'ON'} · Music: ${on('pg-music')?'ON':'OFF'}`;document.querySelectorAll('[data-action=voice]').forEach(b=>b.textContent='Voice '+(on('pg-quiet-voice')?'ON':'OFF'));document.querySelectorAll('[data-action=fx]').forEach(b=>b.textContent='Sound FX '+(get('pg-effects-off')==='yes'?'OFF':'ON'));document.querySelectorAll('[data-action=music]').forEach(b=>b.textContent='Music '+(on('pg-music')?'ON':'OFF'));}
function show(title,body){$('dlgTitle').textContent=title;$('dlgBody').textContent=body;$('dlg').showModal()}
function action(k){if(k==='voice')set('pg-quiet-voice',!on('pg-quiet-voice'));else if(k==='fx'){localStorage.setItem('pg-effects-off',get('pg-effects-off')==='yes'?'no':'yes');render()}else if(k==='music')set('pg-music',!on('pg-music'));else if(k==='full'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}else if(k==='reset'){if(confirm('Delete saved game progress from this device?')){Object.keys(localStorage).filter(k=>k.startsWith('pg-')&&!['pg-quiet-voice','pg-effects-off','pg-music'].includes(k)).forEach(k=>localStorage.removeItem(k));show('Progress reset','Pocket Gamebox progress preferences cleared.')}}else if(k==='help')show('How to Play','Select a game to open it. Each game has its own rules and controls. Voice stays OFF until switched ON.');else if(k==='settings')show('Audio settings','Use Voice, Sound FX, and Music buttons on the lobby. Preferences are saved on this device.')} 
document.querySelectorAll('.control').forEach(b=>b.addEventListener('click',()=>action(b.id)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));$('close').addEventListener('click',()=>$('dlg').close());render();
</script></body></html>
